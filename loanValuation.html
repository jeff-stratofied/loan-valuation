<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loan Valuation</title>
  <link rel="stylesheet" href="/loan-valuation/shared.css">
</head>
<body>

<section id="valuation-model">

  <main class="valuation-container">

    <header class="valuation-header">
      <h1>Loan Valuation</h1>
      <p class="subtitle" id="user-display">Viewing as <strong>Jeff</strong></p>
    </header>

    <!-- Tabs (like amort) -->
    <div class="valuation-tabs">
      <div class="valuation-tab active" data-view="all">All Loans</div>
      <div class="valuation-tab" data-view="portfolio">My Portfolio</div>
      <div class="valuation-tab" data-view="market">Marketplace</div>
    </div>

    <!-- Filters (like amort) -->
    <div class="valuation-filters">
      <input type="text" id="search" placeholder="Search loans..." />
      <select id="school-filter" multiple></select>
      <select id="risk-filter">
        <option value="">All Risk Tiers</option>
        <option value="LOW">Low</option>
        <option value="MEDIUM">Medium</option>
        <option value="HIGH">High</option>
      </select>
      <button id="clear-filters">Clear Filters</button>
    </div>

    <!-- Table -->
    <table class="valuation-table">
      <thead>
        <tr>
          <th><input type="checkbox" id="select-all"></th>
          <th>Loan Name</th>
          <th>School</th>
          <th>Risk Tier</th>
          <th>FICO</th>
          <th class="metric">Balance</th>
          <th class="metric">NPV</th>
          <th class="metric">IRR</th>
          <th class="metric">WAL</th>
          <th class="metric">% Owned</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="valuation-body"></tbody>
    </table>

  </main>

  <!-- Bundle Panel -->
  <div class="bundle-panel" id="bundle-panel" style="display:none;">
    <h3>Selected Bundle (<span id="bundle-count">0</span> loans)</h3>
    <div style="margin:16px 0;">
      <div>Total Invested: <strong id="bundle-invested">$0</strong></div>
      <div>Est. NPV: <strong id="bundle-npv">$0</strong></div>
      <div>Avg IRR: <strong id="bundle-irr">—</strong></div>
    </div>
    <button id="buy-selected" class="btn-buy">Buy Selected Loans</button>
    <button id="clear-bundle" style="margin-top:8px; width:100%; background:transparent; border:1px solid var(--border);">Clear Selection</button>
  </div>

  <!-- Your existing drawer stays 100% unchanged -->
  <div id="valuation-drawer" class="drawer hidden">
    <!-- Paste your entire original drawer HTML here (from <div class="drawer-header"> to the end) -->
    <!-- I kept it out of this message for brevity — copy it from your current file -->
  </div>

<script type="module">
import { valueLoan, loadValuationCurves, loadSchoolTiers, VALUATION_CURVES, SCHOOLTIERS, deriveFicoBand, getSchoolName } from "./valuationEngine.js?v=dev";
import { getUserOwnershipPct, normalizeOwnership } from "./ownershipEngine.js?v=dev";
import { loadBorrowers, BORROWERS, getBorrowerById } from "./borrowerStore.js?v=dev";

const BACKEND_URL = "https://loan-valuation-api.jeff-263.workers.dev";
let currentUser = "jeff";
let allLoans = [];
let displayedLoans = [];
let selectedLoans = new Set();
let currentView = "all";
let isEmbed = false;

// URL params
const urlParams = new URLSearchParams(location.search);
currentUser = urlParams.get("user") || "jeff";
isEmbed = urlParams.get("embed") === "true" || urlParams.get("from") === "reporting";

if (isEmbed) document.documentElement.classList.add("embed-mode");

document.getElementById("user-display").innerHTML = `Viewing as <strong>${currentUser}</strong>`;

// Safeguard for BORROWERS
if (!Array.isArray(BORROWERS)) {
  console.warn("BORROWERS was not an array — resetting");
  window.BORROWERS = [];
}

// Load data
async function init() {
  await Promise.all([
    loadBorrowers(`${BACKEND_URL}/borrowers`),
    loadValuationCurves(`${BACKEND_URL}/valuationCurves`),
    loadSchoolTiers(`${BACKEND_URL}/schoolTiers`)
  ]);

  const res = await fetch(`${BACKEND_URL}/loans`, { cache: "no-store" });
  const data = await res.json();
  allLoans = data.loans || [];

  allLoans.forEach(loan => normalizeOwnership(loan));

  // Final safeguard
  if (!Array.isArray(BORROWERS)) BORROWERS = [];

  renderFilters();
  renderTable();
}

function getUserPct(loan) {
  return getUserOwnershipPct(loan, currentUser);
}

function isPortfolioLoan(loan) {
  return getUserPct(loan) > 0;
}

function renderTable() {
  const tbody = document.getElementById("valuation-body");
  tbody.innerHTML = "";

  displayedLoans = allLoans.filter(loan => {
    if (currentView === "portfolio") return isPortfolioLoan(loan);
    if (currentView === "market") return !isPortfolioLoan(loan);
    return true;
  });

  displayedLoans.forEach(loan => {
    const borrower = getBorrowerById(loan.borrowerId) || {};
    const val = valueLoan({ loan, borrower, riskFreeRate: 0.0423 });
    const ownedPct = getUserPct(loan);

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td><input type="checkbox" data-loanid="${loan.loanId}"></td>
      <td>${loan.loanName}</td>
      <td>${loan.school}</td>
      <td>${val.riskTier || "—"}</td>
      <td>${borrower.borrowerFico || "—"}</td>
      <td class="metric">$${(loan.principal || 0).toLocaleString()}</td>
      <td class="metric">$${(val.npv || 0).toLocaleString()}</td>
      <td class="metric">${val.irr ? val.irr.toFixed(1) + "%" : "—"}</td>
      <td class="metric">${val.wal ? val.wal.toFixed(1) : "—"}</td>
      <td class="metric owned-pct">${(ownedPct * 100).toFixed(0)}%</td>
      <td>
        ${ownedPct === 0 ? `<button class="btn-buy" data-action="buy" data-loanid="${loan.loanId}">Buy</button>` : `<button>Detail</button>`}
      </td>
    `;
    tbody.appendChild(tr);
  });

  updateBundlePanel();
}

// Tab switching
document.querySelectorAll(".valuation-tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".valuation-tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    currentView = tab.dataset.view;
    renderTable();
  });
});

// Selection
document.addEventListener("change", e => {
  if (e.target.dataset.loanid) {
    const id = e.target.dataset.loanid;
    if (e.target.checked) selectedLoans.add(id);
    else selectedLoans.delete(id);
    updateBundlePanel();
  }
});

function updateBundlePanel() {
  const panel = document.getElementById("bundle-panel");
  const count = selectedLoans.size;
  panel.style.display = count ? "block" : "none";
  document.getElementById("bundle-count").textContent = count;
}

// Buy stub
document.addEventListener("click", e => {
  if (e.target.dataset.action === "buy") {
    const loanId = e.target.dataset.loanid;
    const loan = allLoans.find(l => l.loanId === loanId);
    alert(`Added "${loan.loanName}" to cart.\n\n(Stub — ready for real buy page)`);
  }
});

function renderFilters() {
  const schoolSelect = document.getElementById("school-filter");
  const schools = [...new Set(allLoans.map(l => l.school).filter(Boolean))];
  schools.forEach(s => {
    const opt = document.createElement("option");
    opt.value = s;
    opt.textContent = s;
    schoolSelect.appendChild(opt);
  });
}

init();
</script>



</section>

<!-- Add once at bottom of loanValuation.html body -->
<div id="curveModal" class="modal hidden">
  <div class="modal-content">
    <button class="modal-close" onclick="document.getElementById('curveModal').classList.add('hidden')">×</button>
    <h3 id="modalTitle" class="modal-title">Valuation Curves</h3>
    <div class="modal-grid">
      <div class="chart-section">
        <h4 class="chart-subtitle">Cumulative Default Curve</h4>
        <div class="chart-wrapper">
          <canvas id="defaultChart"></canvas>
        </div>
      </div>
      <div class="chart-section">
        <h4 class="chart-subtitle">Annual Prepayment (CPR)</h4>
        <div class="chart-wrapper">
          <canvas id="cprChart"></canvas>
        </div>
      </div>
    </div>
  </div>
</div>
  

  
<!-- Chart.js CDN – add this if not already present -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
  
</body>
</html>
