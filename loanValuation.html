<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loan Valuation</title>
  <link rel="stylesheet" href="/loan-valuation/shared.css">
</head>
<body>

<div class="app">

  <header class="valuation-header">
    <h1>Loan Valuation</h1>
    <p class="subtitle" id="user-display">Viewing as <strong>Jeff</strong></p>
  </header>

  <!-- KPI Row (fixed) -->
  <section class="valuation-kpis" id="kpis"></section>

  <!-- Tabs (fixed) -->
  <div class="valuation-tabs">
    <div class="valuation-tab active" data-view="all">All Loans</div>
    <div class="valuation-tab" data-view="portfolio">My Portfolio</div>
    <div class="valuation-tab" data-view="market">Marketplace</div>
  </div>

  <!-- Filters + Actions (fixed, clean row) -->
  <div class="valuation-filters">
    <input type="text" id="search" placeholder="Search loans..." />
    <select id="school-filter" multiple></select>
    <select id="risk-filter">
      <option value="">All Risk Tiers</option>
      <option value="LOW">Low</option>
      <option value="MEDIUM">Medium</option>
      <option value="HIGH">High</option>
    </select>
    <button class="btn" id="clear-filters">Clear Filters</button>
    <div class="filter-actions">
      <div class="view-toggle">
        <button class="view-btn active" data-view="full">Full</button>
        <button class="view-btn" data-view="compact">Compact</button>
        <button class="view-btn" data-view="table">Table</button>
      </div>
      <button class="btn" id="downloadAllCsvBtn">Download CSV</button>
      <button class="btn" id="copyAllCsvBtn">Copy CSV</button>
      <button class="btn" id="printAllBtn">Print</button>
    </div>
  </div>

  <!-- Tile Grid (2-wide, fixed) -->
  <section class="grid" id="loanGrid"></section>

  <!-- Table View (now renders) -->
  <section id="loanTableWrap" class="loan-table-wrap" hidden>
    <table class="valuation-table">
      <thead>
        <tr>
          <th><input type="checkbox" id="select-all"></th>
          <th>Loan Name</th>
          <th>School</th>
          <th>Risk Tier</th>
          <th>FICO</th>
          <th class="metric">Balance</th>
          <th class="metric">NPV</th>
          <th class="metric">IRR</th>
          <th class="metric">WAL</th>
          <th class="metric">% Owned</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="valuation-body"></tbody>
    </table>
  </section>

</div>

<!-- Bundle Panel (fixed) -->
<div class="bundle-panel" id="bundle-panel" style="display:none;">
  <h3>Selected Bundle (<span id="bundle-count">0</span> loans)</h3>
  <div style="margin:16px 0;">
    <div>Total Invested: <strong id="bundle-invested">$0</strong></div>
    <div>Est. NPV: <strong id="bundle-npv">$0</strong></div>
    <div>Avg IRR: <strong id="bundle-irr">—</strong></div>
  </div>
  <button id="buy-selected" class="btn primary">Buy Selected Loans</button>
  <button id="clear-bundle" class="btn">Clear Selection</button>
</div>

<div id="valuation-drawer" class="drawer hidden">
  <div class="drawer-header">
    <h2>Loan Valuation Details</h2>
    <button class="close-drawer-btn" onclick="document.getElementById('valuation-drawer').classList.add('hidden')">×</button>
  </div>

  <div class="drawer-body">
    <!-- Loan Inputs -->
    <section id="val-loan-inputs"></section>

    <!-- Borrower Profile -->
    <section id="val-borrower"></section>

    <!-- Derived Risk Factors -->
    <section id="val-risk"></section>

    <!-- Discount Rate Breakdown -->
    <section id="val-discount-table"></section>

    <!-- Valuation Summary -->
    <section id="val-summary"></section>

    <!-- Inside .drawer-body, after val-summary -->
<section id="val-curves-section">
  <h3>Valuation Curves</h3>
  <div class="chart-grid">
    <div class="chart-section">
      <h4>Cumulative Default Curve</h4>
      <canvas id="drawer-defaultChart" height="180"></canvas>
    </div>
    <div class="chart-section">
      <h4>Annual Prepayment (CPR)</h4>
      <canvas id="drawer-cprChart" height="180"></canvas>
    </div>
  </div>
</section>
  </div>
</div>


  

<script type="module">
import { valueLoan, loadValuationCurves, loadSchoolTiers, VALUATION_CURVES, SCHOOLTIERS, deriveFicoBand, getSchoolName } from "./valuationEngine.js?v=dev";
import { getUserOwnershipPct, normalizeOwnership } from "./ownershipEngine.js?v=dev";
import { loadBorrowers, BORROWERS, getBorrowerById } from "./borrowerStore.js?v=dev";
import { getEffectiveBorrower } from "./valuationOverrides.js?v=dev";

// ───────────────────────────────────────────────
// GLOBAL STATE
// ───────────────────────────────────────────────
const BACKEND_URL = "https://loan-valuation-api.jeff-263.workers.dev";
let currentUser = "jeff";
let allLoans = [];
let currentView = "all";
let selectedLoans = new Set();
let isEmbed = false;

  const RISK_FREE_RATE = 0.0423;   // ← You were using this everywhere

// ───────────────────────────────────────────────
// URL PARAMS & EMBED MODE
// ───────────────────────────────────────────────
const urlParams = new URLSearchParams(location.search);
currentUser = urlParams.get("user") || "jeff";
isEmbed = urlParams.get("embed") === "true" || urlParams.get("from") === "reporting";

if (isEmbed) document.documentElement.classList.add("embed-mode");

document.getElementById("user-display").innerHTML = `Viewing as <strong>${currentUser}</strong>`;

// Safeguard for BORROWERS
if (!Array.isArray(BORROWERS)) {
  console.warn("BORROWERS was not an array — resetting");
  window.BORROWERS = [];
}

function closeValuationDrawer() {
  const drawer = document.getElementById("valuation-drawer");
  if (drawer) drawer.classList.add("hidden");
}

const viewButtons = document.querySelectorAll(".view-btn");

function setViewMode(mode) {
  document.querySelectorAll(".view-btn").forEach(b =>
    b.classList.toggle("active", b.dataset.view === mode)
  );

  document.getElementById("loanGrid").style.display = (mode === "table") ? "none" : "grid";
  document.getElementById("loanTableWrap").hidden = (mode !== "table");

  if (mode === "table") renderTable(); // your existing table render function
  else renderLoanGrid();
}

viewButtons.forEach(btn => {
  btn.addEventListener("click", () => setViewMode(btn.dataset.view));
});
  
  
// ───────────────────────────────────────────────
// YOUR ORIGINAL openValuationDrawer (unchanged)
// ───────────────────────────────────────────────
function openValuationDrawer({ loan, borrower, valuation }, clickedRow = null) {
  const drawer = document.getElementById("valuation-drawer");
  if (!drawer) {
    console.warn("Valuation drawer element not found – skipping open");
    return;
  }
  // Clear any existing active row highlights
  document.querySelectorAll('.valuation-table tbody tr.active')
    .forEach(tr => tr.classList.remove('active'));
  // Highlight the clicked row if provided
  if (clickedRow) {
    clickedRow.classList.add('active');
  }
  // Display the drawer
  drawer.classList.remove("hidden");
  // Attach loan data to drawer for internal use
  drawer._loan = loan;
  // Retrieve the authoritative borrower record
  const systemBorrower = getBorrowerById(loan.borrowerId) ?? {};
  // Store a clean copy of system values for display consistency / reset logic if needed later
  drawer._systemBorrower = {
    borrowerFico: systemBorrower.borrowerFico ?? null,
    cosignerFico: systemBorrower.cosignerFico ?? null,
    degreeType: systemBorrower.degreeType ?? "Other",
    school: systemBorrower.school ?? "Unknown",
    yearInSchool: systemBorrower.yearInSchool ?? 1,
    isGraduateStudent: systemBorrower.isGraduateStudent ?? false,
    opeid: systemBorrower.opeid ?? "" // ADD THIS
  };
  // Use the already-provided effective borrower (system + any existing overrides)
  // This is the value that was used to calculate the valuation passed in
  drawer._borrower = borrower;
  // Render the read-only details using the effective borrower data
  renderValuationDetails(loan, drawer._borrower, valuation);

  drawer.classList.remove("hidden");
// Delay chart render until drawer is visible
setTimeout(() => {
  renderValuationDetails(loan, drawer._borrower, valuation);
}, 100);
}

// ───────────────────────────────────────────────
// OVERRIDES SUPPORT (minimal version)
// ───────────────────────────────────────────────
let VALUATION_OVERRIDES = new Map();

function loadOverrides() {
  try {
    const saved = localStorage.getItem("loanValuationOverrides");
    if (saved) {
      const parsed = JSON.parse(saved);
      VALUATION_OVERRIDES = new Map(Object.entries(parsed));
    }
  } catch (e) {
    console.warn("Failed to load valuation overrides from localStorage", e);
    VALUATION_OVERRIDES = new Map();
  }
}

async function init() {
  loadOverrides();   // ← now defined

  const BACKEND_URL = "https://loan-valuation-api.jeff-263.workers.dev";

  // 1. Load loans
  let loanData;
  try {
    const res = await fetch(`${BACKEND_URL}/loans`, { cache: "no-store" });
    if (!res.ok) throw new Error(`Loans fetch failed: ${res.status}`);
    loanData = await res.json();
  } catch (err) {
    console.warn("Backend loans failed:", err);
    // Fallback if you have loadLoans() defined elsewhere
    // loanData = await loadLoans();
    loanData = { loans: [] };
  }

  allLoans = loanData.loans || [];
  allLoans = allLoans.filter(loan => !loan.events?.some(e => e.type === 'default'));

  // 2. Load borrowers
  try {
    const res = await fetch(`${BACKEND_URL}/borrowers`, { cache: "no-store" });
    if (res.ok) {
      const data = await res.json();
      BORROWERS.length = 0;
      BORROWERS.push(...(data.borrowers || data || []));
    }
  } catch (err) {
    console.warn("Borrowers fetch failed, using fallback");
  }

  // 3. Load curves
  try {
    await loadValuationCurves(`${BACKEND_URL}/valuationCurves`, { cache: "no-store" });
  } catch (err) {
    console.warn("Curves fetch failed");
  }

  // 4. Load school tiers
  try {
    await loadSchoolTiers(`${BACKEND_URL}/schoolTiers`, { cache: "no-store" });
  } catch (err) {
    console.warn("School tiers fetch failed");
  }

  // Render the page
  renderKpis();
  renderFilters();
  renderLoanGrid();
  setViewMode("full");
}

function renderValuationDetails(loan, borrower, valuation) {
  // 1. Loan Inputs
  document.getElementById("val-loan-inputs").innerHTML = `
    <div>Principal: $${Number(loan.principal).toLocaleString()}</div>
    <div>Rate: ${(loan.rate * 100).toFixed(2)}%</div>
    <div>Term: ${loan.termYears} years</div>
  `;

  // 2. Borrower Profile
  const effectiveFico = Math.max(borrower.borrowerFico || 0, borrower.cosignerFico || 0);
  document.getElementById("val-borrower").innerHTML = `
    <div>Borrower FICO: ${borrower.borrowerFico || "—"}</div>
    <div>Cosigner FICO: ${borrower.cosignerFico || "—"}</div>
    <div>Degree Type: ${borrower.degreeType || "Other"}</div>
    <div>School: ${getSchoolName(borrower.school, borrower.opeid)}</div>
    <div>Year in School: ${borrower.yearInSchool || "—"}</div>
    <div>Graduate Student: ${borrower.isGraduateStudent ? "Yes" : "No"}</div>
    <div>FICO Band: ${deriveFicoBand(effectiveFico)}</div>
  `;

  // 3. Derived Risk Factors
  const tierColorMap = { /* your original map here – unchanged */ };
  const color = tierColorMap[valuation.riskTier] || "gray";
  document.getElementById("val-risk").innerHTML = `
    <div>Risk Tier: <span class="text-${color}-600 font-bold">${valuation.riskTier}</span></div>
    <div>Base Risk (bps): ${valuation.riskBreakdown?.baseRiskBps ?? "—"}</div>
    <div>Degree Adj: ${valuation.riskBreakdown?.degreeAdj ?? "—"}</div>
    <div>School Adj: ${valuation.riskBreakdown?.schoolAdj ?? "—"}</div>
    <div>Year Adj: ${valuation.riskBreakdown?.yearAdj ?? "—"}</div>
    <div>Grad Adj: ${valuation.riskBreakdown?.gradAdj ?? "—"}</div>
    <div>Total Risk (bps): ${valuation.riskBreakdown?.totalRiskBps ?? "—"}</div>
  `;

  // 4. Discount Rate Breakdown
  document.getElementById("val-discount-table").innerHTML = `
    <tr><td>Risk-Free Rate</td><td>${(RISK_FREE_RATE * 100).toFixed(2)}%</td></tr>
    <tr><td>Risk Premium</td><td>${((valuation.discountRate - RISK_FREE_RATE) * 100).toFixed(2)}%</td></tr>
    <tr><td>Total Discount Rate</td><td class="font-bold">${(valuation.discountRate * 100).toFixed(2)}%</td></tr>
  `;

  // 5. Valuation Summary
  const npvRatio = loan.principal > 0 ? (valuation.npv / loan.principal) - 1 : null;
  document.getElementById("val-summary").innerHTML = `
    <div>NPV: <span class="font-bold">$${Math.round(valuation.npv).toLocaleString()}</span></div>
    <div>NPV / Principal: ${npvRatio == null ? "—" : `${(npvRatio * 100).toFixed(1)}%`}</div>
    <div>IRR: <span class="font-bold" title="Internal Rate of Return – annualized yield considering timing of all expected cash flows">
      ${valuation.irr && Number.isFinite(valuation.irr) ? valuation.irr.toFixed(2) + '%' : '—'}
    </span></div>
    <div>Expected Loss %: ${(valuation.expectedLoss * 100).toFixed(2)}%</div>
    <div>WAL (yrs): ${valuation.wal.toFixed(1)}</div>
  `;

  // 6. Valuation Curves – rendered DIRECTLY in drawer (no modal)
  const defaultData = valuation.curve?.defaultCurve?.cumulativeDefaultPct ?? [];
  const prepayData = valuation.curve?.prepaymentCurve?.valuesPct ?? [];

  // Clean up any old charts first
  destroyChart(window.drawerDefaultChart);
  destroyChart(window.drawerCprChart);

  // Cumulative Default Curve
  const defaultCanvas = document.getElementById('drawer-defaultChart');
  if (defaultCanvas) {
    if (defaultData.length === 0) {
      defaultCanvas.parentNode.innerHTML += '<p style="text-align:center; color:#999; margin-top:20px;">No default curve data available</p>';
    } else {
      window.drawerDefaultChart = new Chart(defaultCanvas, {
        type: 'line',
        data: {
          labels: Array.from({ length: defaultData.length }, (_, i) => `Year ${i + 1}`),
          datasets: [{
            label: 'Cumulative Default %',
            data: defaultData,
            borderColor: '#dc2626',
            backgroundColor: 'rgba(220, 38, 38, 0.1)',
            fill: true,
            tension: 0,
            stepped: 'after'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: { beginAtZero: true, title: { display: true, text: '%' } }
          }
        }
      });
    }
  }

  // Annual Prepayment (CPR)
  const cprCanvas = document.getElementById('drawer-cprChart');
  if (cprCanvas) {
    if (prepayData.length === 0) {
      cprCanvas.parentNode.innerHTML += '<p style="text-align:center; color:#999; margin-top:20px;">No prepayment data available</p>';
    } else {
      window.drawerCprChart = new Chart(cprCanvas, {
        type: 'bar',
        data: {
          labels: Array.from({ length: prepayData.length }, (_, i) => `Year ${i + 1}`),
          datasets: [{
            label: 'Annual CPR %',
            data: prepayData,
            backgroundColor: '#3b82f6'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: { beginAtZero: true, title: { display: true, text: '%' } }
          }
        }
      });
    }
  }
}

function rerunValuation(drawer) {
  const systemBorrower = drawer._systemBorrower;

  const borrower = getEffectiveBorrower({
    loan: drawer._loan,
    systemBorrower
  });

  const valuation = valueLoan({
    loan: drawer._loan,
    borrower,
    riskFreeRate: RISK_FREE_RATE
  });

  renderValuationDetails(
    drawer._loan,
    borrower,
    valuation
  );

  // Keep drawer state in sync
  drawer._borrower = borrower;

  // Manually trigger table row re-render to reflect the "Edited" badge
  renderLoanGrid();
}

window.resetValuationOverride = function () {
  const drawer = document.getElementById("valuation-drawer");
  const loanId = drawer._loan.loanId;

  // Remove override from the in-memory map
  VALUATION_OVERRIDES.delete(loanId);

  // Remove override from localStorage
  const overrides = Object.fromEntries(VALUATION_OVERRIDES.entries());
  localStorage.setItem("loanValuationOverrides", JSON.stringify(overrides));

  // Get the system borrower data (i.e., before any overrides)
  const systemBorrower = drawer._systemBorrower;

  // Manually reset form fields with system borrower values
  const ficoSelect = document.getElementById("val-borrower-fico");
  ficoSelect.value = systemBorrower.borrowerFico ?? "";

  const degreeSelect = document.getElementById("val-degree-type");
  degreeSelect.value = systemBorrower.degreeType ?? "Other";

  // Prepare the borrower data for recalculation - COMPLETE WITH ALL FIELDS
  const borrower = {
  borrowerFico: ficoSelect.value ? Number(ficoSelect.value) : systemBorrower.borrowerFico,
  degreeType: degreeSelect.value || systemBorrower.degreeType,
  cosignerFico: systemBorrower.cosignerFico ?? null,
  school: systemBorrower.school ?? "Unknown",
  yearInSchool: systemBorrower.yearInSchool ?? 1,
  isGraduateStudent: systemBorrower.isGraduateStudent ?? false,
  opeid: systemBorrower.opeid ?? ""  // ADD THIS
};

  // Re-run valuation for the updated loan (to reflect the reset)
  const valuation = valueLoan({
    loan: drawer._loan,
    borrower,
    riskFreeRate: RISK_FREE_RATE
  });

  // Recalculate the discount rate and NPV with updated values
  renderValuationDetails(drawer._loan, borrower, valuation);

  // Refresh the table to reflect the changes (no overrides)
  renderLoanGrid();

  // Re-populate the drawer inputs with system values immediately, passing the recalculated valuation
  // OPTIONAL: Comment out or remove this if you want to avoid redundancy (drawer is already updated and open)
  openValuationDrawer({
    loan: drawer._loan,
    borrower: systemBorrower,
    valuation: valuation // Pass the recalculated valuation object here
  });
};

function getIRRColorClass(irr) {
  if (typeof irr !== 'number' || isNaN(irr)) return 'text-gray-500'; // Gray for invalid

  if (irr < 0)          return 'text-red-600 font-bold';    // Negative → bold red
  if (irr < 3)          return 'text-red-600';              // Very low → red
  if (irr < 6)          return 'text-orange-600';           // Low → orange
  if (irr < 9)          return 'text-yellow-600';           // Moderate → yellow
  if (irr < 12)         return 'text-green-600';            // Good → green
  return 'text-green-600 font-bold';                        // Strong → bold green
}



// Helper: safely destroy a chart instance
function destroyChart(chartInstance) {
  if (chartInstance && typeof chartInstance.destroy === 'function') {
    chartInstance.destroy();
  }
}

function renderKpis() {
  // Simple portfolio-level KPIs (you can expand later with real aggregates)
  const totalInvested = allLoans.reduce((sum, l) => sum + (Number(l.principal) || 0), 0);
  const ownedLoans = allLoans.filter(l => getUserOwnershipPct(l, currentUser) > 0);
  const avgIRR = ownedLoans.length 
    ? ownedLoans.reduce((sum, l) => {
        const val = valueLoan({ loan: l, borrower: getBorrowerById(l.borrowerId) || {}, riskFreeRate: 0.0423 });
        return sum + (val.irr || 0);
      }, 0) / ownedLoans.length 
    : 0;

  document.getElementById("kpis").innerHTML = `
    <div class="valuation-kpi">
      <h3>Total Invested</h3>
      <p>$${totalInvested.toLocaleString()}</p>
    </div>
    <div class="valuation-kpi">
      <h3>My Avg IRR</h3>
      <p>${avgIRR.toFixed(2)}%</p>
    </div>
    <div class="valuation-kpi">
      <h3>Total NPV</h3>
      <p>—</p>
    </div>
    <div class="valuation-kpi">
      <h3>Valuation Spread</h3>
      <p>—</p>
    </div>
  `;
}

function renderFilters() {
  const schoolSelect = document.getElementById("school-filter");
  schoolSelect.innerHTML = '<option value="">All Schools</option>'; // reset

  // Get unique schools from loaded loans
  const schools = [...new Set(allLoans.map(l => l.school).filter(Boolean))];
  schools.sort(); // alphabetical

  schools.forEach(school => {
    const option = document.createElement("option");
    option.value = school;
    option.textContent = school;
    schoolSelect.appendChild(option);
  });

  // Optional: pre-select if there's a URL param or saved preference
  // (you can expand this later)
}

// paste renderLoanGrid() here (with the updated click handler below)

function renderLoanGrid() {
  const grid = document.getElementById("loanGrid");
  grid.innerHTML = "";

  allLoans.forEach(loan => {
    const borrower = getBorrowerById(loan.borrowerId) || {};
    const valuation = valueLoan({ loan, borrower, riskFreeRate: 0.0423 });

    const tile = document.createElement("div");
    tile.className = "tile";
    tile.innerHTML = `
      <div class="tile-left">
        <div class="loan-name">${loan.loanName}</div>
        <div class="loan-school">${loan.school}</div>
        <div class="loan-meta">
          ${(valuation.irr || 0).toFixed(1)}% IRR • ${valuation.riskTier || "—"}
        </div>
      </div>
      <div class="chart-wrap">
        <svg class="sparkline" width="170" height="48"></svg>
      </div>
    `;

    // OPEN YOUR DRAWER ON TILE CLICK
    tile.addEventListener("click", () => {
      openValuationDrawer({ loan, borrower, valuation });
    });

    grid.appendChild(tile);
  });
}
  
// ───────────────────────────────────────────────
// START EVERYTHING
// ───────────────────────────────────────────────
init();
</script>

</section>
